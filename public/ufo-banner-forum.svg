<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200">
  <defs>
    <linearGradient id="sky3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0015"/>
      <stop offset="50%" style="stop-color:#1a0030"/>
      <stop offset="100%" style="stop-color:#2a0050"/>
    </linearGradient>
    <radialGradient id="wormhole" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#7c4dff;stop-opacity:0.8"/>
      <stop offset="20%" style="stop-color:#7c4dff;stop-opacity:0.4"/>
      <stop offset="60%" style="stop-color:#1a237e;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#000;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="1200" height="200" fill="url(#sky3)"/>

  <!-- Wormhole - Interstellar style -->
  <circle cx="600" cy="100" r="70" fill="url(#wormhole)"/>
  <circle cx="600" cy="100" r="55" fill="none" stroke="#7c4dff" stroke-width="0.5" opacity="0.4"/>
  <circle cx="600" cy="100" r="40" fill="none" stroke="#673ab7" stroke-width="0.3" opacity="0.3"/>
  <circle cx="600" cy="100" r="25" fill="none" stroke="#7c4dff" stroke-width="0.4" opacity="0.2" transform="rotate(30,600,100)"/>
  
  <!-- Spiral arms -->
  <g opacity="0.3" fill="none" stroke="#7c4dff" stroke-width="0.8">
    <path d="M600,100 Q620,80 640,90 Q660,100 640,120 Q620,130 600,120 Q580,110 600,100"/>
    <path d="M600,100 Q580,120 560,110 Q540,100 560,80 Q580,70 600,80 Q620,90 600,100"/>
  </g>

  <!-- Stars (Interstellar has sparse, bright stars) -->
  <g fill="#fff">
    <circle cx="100" cy="50" r="1.5" opacity="0.8"/>
    <circle cx="250" cy="80" r="1" opacity="0.6"/>
    <circle cx="400" cy="30" r="1.2" opacity="0.7"/>
    <circle cx="750" cy="45" r="1.8" opacity="0.9"/>
    <circle cx="900" cy="70" r="1" opacity="0.5"/>
    <circle cx="1050" cy="35" r="1.3" opacity="0.7"/>
    <circle cx="1150" cy="80" r="0.8" opacity="0.5"/>
    <circle cx="350" cy="100" r="0.5" opacity="0.3"/>
    <circle cx="850" cy="120" r="0.6" opacity="0.3"/>
    <circle cx="150" cy="110" r="0.4" opacity="0.2"/>
  </g>

  <!-- Dust clouds -->
  <ellipse cx="200" cy="150" rx="150" ry="40" fill="#6a1b9a" opacity="0.04"/>
  <ellipse cx="1000" cy="140" rx="120" ry="35" fill="#4a148c" opacity="0.03"/>
  
  <!-- Spacecraft silhouette (tiny, heading toward wormhole) -->
  <g transform="translate(340, 90) rotate(-15)">
    <ellipse cx="0" cy="0" rx="8" ry="3" fill="#444" opacity="0.4"/>
    <rect x="-3" y="-3" width="6" height="6" rx="2" fill="#555" opacity="0.3"/>
  </g>
</svg>
