<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200">
  <defs>
    <linearGradient id="sky2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d2b"/>
      <stop offset="60%" style="stop-color:#1a0a3e"/>
      <stop offset="100%" style="stop-color:#2a0a4e"/>
    </linearGradient>
    <radialGradient id="mothership" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4fc3f7;stop-opacity:0.6"/>
      <stop offset="30%" style="stop-color:#4fc3f7;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#4fc3f7;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="200" fill="url(#sky2)"/>

  <!-- Stars -->
  <g fill="#fff" opacity="0.5">
    <circle cx="50" cy="30" r="0.8"/><circle cx="150" cy="80" r="0.6"/>
    <circle cx="280" cy="20" r="1"/><circle cx="400" cy="90" r="0.5"/>
    <circle cx="520" cy="35" r="0.7"/><circle cx="650" cy="75" r="0.9"/>
    <circle cx="800" cy="25" r="0.6"/><circle cx="950" cy="65" r="1"/>
    <circle cx="1080" cy="30" r="0.8"/><circle cx="350" cy="55" r="0.4"/>
    <circle cx="750" cy="50" r="0.5"/><circle cx="850" cy="85" r="0.3"/>
    <circle cx="200" cy="45" r="0.4"/><circle cx="1000" cy="40" r="0.3"/>
  </g>

  <!-- Giant mothership glowing - Close Encounters style -->
  <circle cx="600" cy="60" r="60" fill="url(#mothership)"/>
  
  <!-- Mothership shape -->
  <path d="M520,70 Q560,25 600,20 Q640,25 680,70 Q700,80 700,85 L500,85 Q500,80 520,70Z" fill="#1a237e" opacity="0.6"/>
  <path d="M540,65 Q570,35 600,30 Q630,35 660,65 L660,80 L540,80Z" fill="#283593" opacity="0.4"/>
  
  <!-- Ship lights -->
  <g filter="url(#glow3)">
    <circle cx="560" cy="60" r="3" fill="#4fc3f7"/>
    <circle cx="580" cy="50" r="2.5" fill="#4fc3f7"/>
    <circle cx="600" cy="45" r="3" fill="#4fc3f7"/>
    <circle cx="620" cy="50" r="2.5" fill="#4fc3f7"/>
    <circle cx="640" cy="60" r="3" fill="#4fc3f7"/>
  </g>

  <!-- Light beams down -->
  <g opacity="0.06">
    <polygon points="570,70 530,160 540,160" fill="#4fc3f7"/>
    <polygon points="590,65 560,160 570,160" fill="#4fc3f7"/>
    <polygon points="610,65 590,160 600,160" fill="#4fc3f7"/>
    <polygon points="630,70 610,160 620,160" fill="#4fc3f7"/>
  </g>

  <!-- Small figures (tiny dots at bottom) -->
  <circle cx="555" cy="175" r="1.5" fill="#fff" opacity="0.3"/>
  <circle cx="565" cy="173" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="575" cy="174" r="1.5" fill="#fff" opacity="0.3"/>
  <circle cx="615" cy="173" r="1.5" fill="#fff" opacity="0.3"/>
  <circle cx="625" cy="174" r="1.5" fill="#fff" opacity="0.4"/>
  
  <!-- Terrain -->
  <path d="M0,195 Q150,180 300,190 Q450,175 500,182 Q530,178 560,182 L640,182 Q700,175 800,185 Q1000,170 1200,190" fill="none" stroke="#1a1a2e" stroke-width="1" opacity="0.4"/>
</svg>
