<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="50%" style="stop-color:#1a1a4e"/>
      <stop offset="100%" style="stop-color:#2a1a3e"/>
    </linearGradient>
    <linearGradient id="nebula" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6a1b9a;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#1a237e;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#4a148c;stop-opacity:0.3"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4fc3f7;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#4fc3f7;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="1"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1200" height="200" fill="url(#sky)"/>
  <rect width="1200" height="200" fill="url(#nebula)"/>
  
  <!-- Stars -->
  <g opacity="0.8">
    <circle cx="50" cy="30" r="1" fill="#fff"/><circle cx="150" cy="80" r="0.8" fill="#fff"/>
    <circle cx="250" cy="20" r="1.2" fill="#fff"/><circle cx="380" cy="60" r="0.6" fill="#fff"/>
    <circle cx="500" cy="25" r="1" fill="#fff"/><circle cx="620" cy="90" r="0.7" fill="#fff"/>
    <circle cx="750" cy="40" r="1.1" fill="#fff"/><circle cx="850" cy="75" r="0.5" fill="#fff"/>
    <circle cx="950" cy="30" r="1" fill="#fff"/><circle cx="1050" cy="85" r="0.9" fill="#fff"/>
    <circle cx="1150" cy="45" r="0.7" fill="#fff"/><circle cx="100" cy="110" r="0.5" fill="#fff"/>
    <circle cx="200" cy="130" r="0.6" fill="#fff"/><circle cx="450" cy="110" r="0.8" fill="#fff"/>
    <circle cx="700" cy="120" r="0.4" fill="#fff"/><circle cx="1100" cy="115" r="0.6" fill="#fff"/>
    <circle cx="330" cy="40" r="0.3" fill="#fff"/><circle cx="680" cy="65" r="0.4" fill="#fff"/>
    <circle cx="890" cy="20" r="0.5" fill="#fff"/><circle cx="1020" cy="55" r="0.3" fill="#fff"/>
  </g>
  
  <!-- Planet -->
  <circle cx="1050" cy="60" r="30" fill="url(#glow)"/>
  <circle cx="1050" cy="60" r="20" fill="#4fc3f7" opacity="0.6"/>
  <circle cx="1050" cy="60" r="15" fill="#29b6f6" opacity="0.4"/>
  <ellipse cx="1050" cy="60" rx="35" ry="5" fill="none" stroke="#4fc3f7" stroke-width="0.5" opacity="0.5" transform="rotate(-20,1050,60)"/>
  
  <!-- Mountain silhouette -->
  <polygon points="0,200 60,160 120,180 180,140 250,170 300,150 380,165 450,130 500,155 550,120 600,145 650,100 700,130 780,110 850,135 920,95 980,125 1050,85 1120,115 1200,90 1200,200" fill="#1a1a2e" opacity="0.6"/>
  <polygon points="0,200 80,170 150,185 220,155 300,175 400,145 500,165 600,130 700,155 800,120 900,145 1000,110 1100,140 1200,115 1200,200" fill="#16162a" opacity="0.5"/>
  
  <!-- UFO 1 - Left side -->
  <g transform="translate(200, 80)">
    <!-- Light beam -->
    <polygon points="0,15 -15,60 15,60" fill="#4fc3f7" opacity="0.08"/>
    <polygon points="0,15 -8,50 8,50" fill="#4fc3f7" opacity="0.12"/>
    <!-- Saucer body -->
    <ellipse cx="0" cy="10" rx="35" ry="6" fill="#9e9e9e"/>
    <ellipse cx="0" cy="10" rx="30" ry="5" fill="#bdbdbd"/>
    <!-- Dome -->
    <ellipse cx="0" cy="6" rx="12" ry="8" fill="#c0c0c0"/>
    <ellipse cx="0" cy="4" rx="10" ry="6" fill="#e0e0e0"/>
    <!-- Lights -->
    <circle cx="-25" cy="10" r="1.5" fill="#4fc3f7" filter="url(#glowFilter)"/>
    <circle cx="-15" cy="12" r="1.5" fill="#4fc3f7" filter="url(#glowFilter)"/>
    <circle cx="0" cy="13" r="1.8" fill="#4fc3f7" filter="url(#glowFilter)"/>
    <circle cx="15" cy="12" r="1.5" fill="#4fc3f7" filter="url(#glowFilter)"/>
    <circle cx="25" cy="10" r="1.5" fill="#4fc3f7" filter="url(#glowFilter)"/>
  </g>

  <!-- UFO 2 - Center-right -->
  <g transform="translate(650, 55) rotate(-5)">
    <polygon points="0,12 -12,50 12,50" fill="#4fc3f7" opacity="0.06"/>
    <ellipse cx="0" cy="8" rx="28" ry="5" fill="#8e8e8e"/>
    <ellipse cx="0" cy="8" rx="24" ry="4" fill="#b0b0b0"/>
    <ellipse cx="0" cy="5" rx="10" ry="6" fill="#b0b0b0"/>
    <ellipse cx="0" cy="3" rx="8" ry="4.5" fill="#d0d0d0"/>
    <circle cx="-20" cy="8" r="1.2" fill="#4fc3f7" filter="url(#glowFilter)"/>
    <circle cx="-10" cy="9.5" r="1.2" fill="#4fc3f7" filter="url(#glowFilter)"/>
    <circle cx="0" cy="10" r="1.5" fill="#4fc3f7" filter="url(#glowFilter)"/>
    <circle cx="10" cy="9.5" r="1.2" fill="#4fc3f7" filter="url(#glowFilter)"/>
    <circle cx="20" cy="8" r="1.2" fill="#4fc3f7" filter="url(#glowFilter)"/>
  </g>

  <!-- Shooting star -->
  <line x1="920" y1="35" x2="970" y2="65" stroke="#fff" stroke-width="1.5" opacity="0.7"/>
  <line x1="920" y1="35" x2="990" y2="75" stroke="#fff" stroke-width="0.5" opacity="0.3"/>
  <circle cx="920" cy="35" r="1.5" fill="#fff"/>

  <!-- Ground glow -->
  <ellipse cx="600" cy="200" rx="400" ry="30" fill="#4fc3f7" opacity="0.03"/>
</svg>
