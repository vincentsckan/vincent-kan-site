<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Redirecting...</title>
<script>
// Redirect old /vincent-kan-site/ paths to /
const path = window.location.pathname;
const newPath = path.replace(/^\/vincent-kan-site/, '');
if (newPath !== path) {
  window.location.replace(newPath + window.location.search + window.location.hash);
} else {
  document.title = '404 - Page Not Found';
  document.body.innerHTML = '<h1>404 - Page Not Found</h1><p><a href="/">Go to Home</a></p>';
}
</script>
</head>
<body>
<noscript>
  <h1>404 - Page Not Found</h1>
  <p><a href="/">Go to Home</a></p>
</noscript>
</body>
</html>
