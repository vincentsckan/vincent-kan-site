name: Generate UFO News Digest

on:
  schedule:
    - cron: '0 */4 * * *'  # Every 4 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate UFO News
        run: python3 scripts/news-engine.py

      - name: Generate Sitemaps
        run: |
          node scripts/generate-news-sitemap.cjs
          node scripts/generate-faq-schema.cjs

      - name: Build Site
        run: npm run build

      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/blog*/*.md public/news-sitemap.xml public/schema/*.json .news-cache.json .news-log.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "🤖 auto: UFO news digest + rebuild [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin master && git push origin HEAD:master && exit 0
            echo "Push failed, retrying ($i)..."; sleep 5
          done
          exit 1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: generate
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
